configuration:
  upstream:
    name: "Home Assistant URL"
    description: "👉 **Step 1: start the web UI to finish the setup.** Dashboards and filter scope are chosen there; the options below are advanced.\n\nAddress of Home Assistant as seen from this add-on (default http://homeassistant:8123)."
  mode:
    name: "Mode"
    description: "exclude: send everything except the exclude file; include: send only dashboard entities (default exclude)."
  exclude_file:
    name: "Exclude file"
    description: "File in the add-on's own config folder, .txt or .list; created automatically (default proxyfilter_exclude.txt)."
  local_only:
    name: "Local network only"
    description: "Refuse connections from public IP addresses (default on)."
  trusted_proxies:
    name: "Trusted reverse proxies"
    description: "Address or network of a reverse proxy in front of this add-on, e.g. 192.168.1.5 (default none)."
  heavy_per_minute:
    name: "Heavy entity warning"
    description: "Warn when a dashboard entity updates more than this many times per minute (default 20)."
  top:
    name: "Lines per log report list"
    description: "Entities per list in the log reports, 0 for none (default 25)."
  max_connections:
    name: "Maximum connections"
    description: "Maximum simultaneous websocket connections through port 8124; more get HTTP 503 (default 20)."
  min_per_minute:
    name: "Log threshold per minute"
    description: "Hide entities below this rate in the per-minute log reports (default 2)."
  min_per_hour:
    name: "Log threshold per hour"
    description: "Hide entities below this rate in the hourly log reports (default 120)."
  verbose:
    name: "Log every HTTP request"
    description: "Log all requests, not only errors and logins (default off)."
network:
  8124/tcp: "Filtered Home Assistant address for the wall panel"
