configuration:
  upstream:
    name: "Home Assistant-URL"
    description: "👉 **Stap 1: start de web-UI om de setup af te ronden.** Dashboards en filterbereik kies je daar; de opties hieronder zijn geavanceerd.\n\nAdres van Home Assistant gezien vanuit deze add-on (standaard http://homeassistant:8123)."
  mode:
    name: "Modus"
    description: "exclude: alles doorsturen behalve het exclude-bestand; include: alleen dashboard-entities (standaard exclude)."
  exclude_file:
    name: "Exclude-bestand"
    description: "Bestand in de eigen configmap van de add-on, .txt of .list; wordt automatisch aangemaakt (standaard proxyfilter_exclude.txt)."
  local_only:
    name: "Alleen lokaal netwerk"
    description: "Weiger verbindingen van publieke IP-adressen (standaard aan)."
  trusted_proxies:
    name: "Vertrouwde reverse proxy's"
    description: "Adres of netwerk van een reverse proxy vóór deze add-on, bijv. 192.168.1.5 (standaard geen)."
  heavy_per_minute:
    name: "Waarschuwing zware entity"
    description: "Waarschuw als een dashboard-entity vaker dan dit aantal keer per minuut verandert (standaard 20)."
  top:
    name: "Regels per lograpport"
    description: "Entities per lijst in de lograpporten, 0 voor geen (standaard 25)."
  max_connections:
    name: "Maximaal aantal verbindingen"
    description: "Maximaal aantal gelijktijdige websocket-verbindingen via poort 8124; extra krijgen HTTP 503 (standaard 20)."
  min_per_minute:
    name: "Logdrempel per minuut"
    description: "Verberg entities onder deze snelheid in de lograpporten per minuut (standaard 2)."
  min_per_hour:
    name: "Logdrempel per uur"
    description: "Verberg entities onder deze snelheid in de lograpporten per uur (standaard 120)."
  verbose:
    name: "Elke HTTP-aanvraag loggen"
    description: "Log alle aanvragen, niet alleen fouten en logins (standaard uit)."
network:
  8124/tcp: "Gefilterd Home Assistant-adres voor het wandpaneel"
