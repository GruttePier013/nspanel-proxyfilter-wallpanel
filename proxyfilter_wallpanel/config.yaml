name: "Proxyfilter for photo/wallpanel"
version: "2.0.4"
slug: proxyfilter_wallpanel
description: "👉 Step 1: start the web UI to finish the setup. The filtering proxy keeps your wall-panel (like Sonoff, Tuya, Shelly) blazing fast by only forwarding traffic related to entities used in the dashboard you configured."
url: "https://github.com/GruttePier013/proxyfilter-wallpanel-addon"
arch:
  - aarch64
  - amd64
  - armv7
stage: experimental
init: false
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8124]/__health"
ingress: true
ingress_port: 8099
panel_icon: "mdi:filter-variant"
panel_title: "Proxyfilter"
panel_admin: true
ports:
  8124/tcp: 8124
ports_description:
  8124/tcp: "Filtered Home Assistant address for the wall panel"
map:
  - homeassistant_config:ro
  - addon_config:rw
options:
  upstream: "http://homeassistant:8123"
  mode: exclude
  exclude_file: "proxyfilter_exclude.txt"
  local_only: true
  trusted_proxies: []
  heavy_per_minute: 20
  top: 25
  max_connections: 20
  min_per_minute: 2
  min_per_hour: 120
  verbose: false
schema:
  upstream: url
  mode: list(include|exclude)
  local_only: bool
  trusted_proxies:
    - str
  exclude_file: match(^[A-Za-z0-9_][A-Za-z0-9_./-]*\.(txt|list)$)
  heavy_per_minute: float(1,)
  top: int(0,200)
  max_connections: int(1,200)
  min_per_minute: float(0,)
  min_per_hour: float(0,)
  verbose: bool
