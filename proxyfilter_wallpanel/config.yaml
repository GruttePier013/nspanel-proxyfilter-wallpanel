name: "Proxyfilter for photo/wallpanel"
version: "2.0.5"
slug: proxyfilter_wallpanel
description: "Proxy for photo/wallpanels. Better hardware focus of cpu, memory on the specific dashboards you use on this device."
url: "https://github.com/GruttePier013/nspanel-proxyfilter-wallpanel"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: "mdi:filter-variant"
panel_title: "Proxyfilter"
ports:
  8124/tcp: 8124
ports_description:
  8124/tcp: "Filtered Home Assistant address for the wall panel"
map:
  - homeassistant_config:ro
  - addon_config:rw
options:
  upstream: "http://homeassistant:8123"
  mode: exclude
  exclude_file: "proxyfilter_exclude.txt"
  local_only: true
  trusted_proxies: []
  heavy_per_minute: 20
  top: 25
  max_connections: 20
  min_per_minute: 2
  min_per_hour: 120
  verbose: false
schema:
  upstream: url
  mode: list(include|exclude)
  local_only: bool
  trusted_proxies:
    - str
  exclude_file: match(^[A-Za-z0-9_][A-Za-z0-9_./-]*\.(txt|list)$)
  heavy_per_minute: float(1,)
  top: int(0,200)
  max_connections: int(1,200)
  min_per_minute: float(0,)
  min_per_hour: float(0,)
  verbose: bool
